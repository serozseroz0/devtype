<!DOCTYPE html>
<html lang="tg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevType Tajikistan | Pure Code Edition</title>
    <style>
        :root {
            --bg-color: #323437;
            --main-color: #e2b714;
            --text-color: #646669;
            --sub-color: #d1d0c5;
            --error-color: #ca4754;
            --panel-bg: #2c2e31;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Consolas', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .main-panel {
            background-color: var(--panel-bg);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            border: 1px solid #3e4042;
            max-width: 800px;
            width: 90%;
            text-align: center;
            position: relative;
        }

        input.name-input {
            background: transparent;
            border: none;
            border-bottom: 2px solid var(--text-color);
            color: var(--main-color);
            font-size: 1.5rem;
            padding: 10px;
            text-align: center;
            outline: none;
            width: 60%;
            margin-bottom: 15px;
        }

        .label {
            display: block;
            font-size: 0.7rem;
            margin: 10px 0 5px;
            color: var(--text-color);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .btn {
            background: none;
            border: 1px solid var(--text-color);
            color: var(--text-color);
            padding: 8px 16px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.2s;
        }

        .btn.active {
            color: var(--main-color);
            border-color: var(--main-color);
            background: rgba(226, 183, 20, 0.1);
        }

        .start-btn {
            background: var(--main-color);
            color: #000;
            border: none;
            padding: 12px 40px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
        }

        .exit-btn {
            background: rgba(202, 71, 84, 0.1);
            color: var(--error-color);
            border: 1px solid var(--error-color);
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.7rem;
            transition: 0.3s;
        }

        .exit-btn:hover {
            background: var(--error-color);
            color: #fff;
        }

        #game-panel {
            text-align: left;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .stat-group {
            display: flex;
            gap: 30px;
        }

        .stat-item span {
            color: var(--main-color);
            font-weight: bold;
        }

        #typing-area {
            font-size: 1.6rem;
            line-height: 1.4;
            min-height: 120px;
            position: relative;
            word-break: break-all;
        }

        .char {
            color: var(--text-color);
            border-left: 2px solid transparent;
        }

        .char.correct {
            color: var(--sub-color) !important;
        }

        .char.incorrect {
            color: var(--error-color) !important;
            background: rgba(202, 71, 84, 0.2);
            text-decoration: underline;
        }

        .char.current {
            border-left: 2px solid var(--main-color);
        }

        #hidden-input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        #pause-overlay {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(44, 46, 49, 0.9);
            border-radius: 25px;
            z-index: 10;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .leaderboard {
            margin-top: 20px;
            font-size: 0.8rem;
            border-top: 1px solid #3e4042;
            padding-top: 10px;
            text-align: center;
        }

        .record-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }

        /* ИН ҶО СЕРТИФИКАТ КАЛОН КАРДА ШУД */
        .certificate {
            background: #fff;
            color: #000;
            padding: 60px;
            border: 20px double var(--main-color);
            text-align: center;
            border-radius: 15px;
            max-width: 900px;
            width: 95%;
        }

        .certificate h2 {
            font-size: 2.8rem;
            margin: 0;
        }

        .cert-name {
            font-size: 4.5rem;
            color: #b8860b;
            margin: 25px 0;
            font-family: serif;
            font-weight: bold;
            border-bottom: 4px solid #b8860b;
            display: inline-block;
        }

        .cert-details {
            font-size: 1.6rem;
            margin: 15px 0;
            color: #333;
        }

        .cert-details span {
            font-weight: bold;
            color: #000;
            font-size: 1.8rem;
        }
    </style>
</head>

<body onclick="document.getElementById('hidden-input').focus()">

    <div id="menu-panel" class="main-panel">
        <h2 style="color: var(--sub-color); margin-bottom: 10px;">DevType <span
                style="color:var(--main-color)">Tajikistan</span></h2>
        <input type="text" id="user-name" class="name-input" placeholder="Номи барномасоз..." autocomplete="off">

        <span class="label">Забони барномасозӣ</span>
        <div class="btn-group">
            <button onclick="setMode('html')" id="btn-html" class="btn active">HTML</button>
            <button onclick="setMode('css')" id="btn-css" class="btn">CSS</button>
            <button onclick="setMode('js')" id="btn-js" class="btn">JS</button>
        </div>

        <span class="label">Вақт (сония)</span>
        <div class="btn-group" id="time-group">
            <button onclick="setTime(15)" class="btn">15</button>
            <button onclick="setTime(30)" class="btn active">30</button>
            <button onclick="setTime(60)" class="btn">60</button>
        </div>

        <button class="start-btn" onclick="startGame()">ОҒОЗ КАРДАН</button>

        <div class="leaderboard">
            <span class="label">Рекордҳои ту</span>
            <div id="records-list"></div>
        </div>
    </div>

    <div id="game-panel" class="main-panel" style="display: none;">
        <div id="pause-overlay">
            <h1 style="color: var(--main-color);">ПАУЗА</h1>
            <p>Барои идома ESC-ро пахш кунед</p>
        </div>
        <div class="stats">
            <div class="stat-group">
                <div class="stat-item">WPM: <span id="wpm">0</span></div>
                <div class="stat-item">Дақиқият: <span id="accuracy">100</span>%</div>
                <div class="stat-item">Вақт: <span id="timer">30</span></div>
                <div class="stat-item">Блок: <span id="progress">1</span>/8</div>
            </div>
            <button class="exit-btn" onclick="location.reload()">БАРОМАД</button>
        </div>
        <input type="text" id="hidden-input" autocomplete="off" spellcheck="false">
        <div id="typing-area"></div>
    </div>

    <div id="cert-modal"
        style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.95); justify-content: center; align-items: center; z-index: 200;">
        <div class="certificate">
            <h2>СЕРТИФИКАТИ МАҲОРАТ</h2>
            <div id="cert-display-name" class="cert-name">Шероз</div>
            <div class="cert-details">Суръати чоп: <span id="cert-wpm-val">0</span> WPM</div>
            <div class="cert-details">Дақиқият: <span id="cert-acc-val">0</span>%</div>
            <div class="cert-details">Калимаҳо: <span id="cert-words-val">0</span></div>
            <div class="cert-details" style="color: var(--error-color);">Хатогиҳо: <span id="cert-errors-val">0</span>
            </div>
            <button class="btn"
                style="margin-top:30px; font-size: 1.4rem; padding: 12px 30px; color:#000; border-color:#000;"
                onclick="location.reload()">АЗ НАВ</button>
        </div>
    </div>

    <script>
        const library = {
            html: [
                "<div class='container-fluid'>",
                "<html><head><title>App</title></head>",
                "<body><header class='nav-wrapper'>",
                "<section id='hero-section'><h1>Welcome</h1>",
                "<img src='assets/img/hero.jpg' alt='Hero'>",
                "<a href='https://github.com' target='_blank'>",
                "<ul class='menu-list'><li>Home Page</li></ul>",
                "<button type='submit' class='btn-success'>",
                "<form action='/api/v1/auth' method='POST'>",
                "<footer class='main-footer'><p>Copyright</p></footer>",
                "<table><thead><tr><th>Username</th></tr></thead></table>",
                "<nav><ol><li>About</li><li>Contact</li></ol></nav>"
            ],
            css: [
                "body { margin: 0; padding: 0; box-sizing: border-box; }",
                ".flex-center { display: flex; align-items: center; }",
                "h1 { color: #f1c40f; font-size: 2rem; font-weight: 700; }",
                ".card { background: #1a1a1a; border: 1px solid #333; }",
                "@media screen and (max-width: 600px) { .row { gap: 10px; } }",
                "button:active { transform: scale(0.95); opacity: 0.8; }",
                "input:focus { border-color: var(--main-color); outline: none; }",
                ".glass-effect { backdrop-filter: blur(10px); background: none; }",
                "span.label { color: #666; text-transform: lowercase; }",
                "p.text-muted { font-style: italic; color: #888; }"
            ],
            js: [
                "const settings = { theme: 'dark', lang: 'en', id: 101 };",
                "async function getData() { const res = await fetch(url); }",
                "if (score >= limit) { return notify('Win'); }",
                "const users = ['Admin', 'Editor', 'Viewer', 'Guest'];",
                "document.querySelector('.app').innerHTML = 'Loading...';",
                "const result = items.map(x => x.price * 1.2);",
                "localStorage.setItem('session_token', btoa(token));",
                "window.addEventListener('resize', () => handleResize());",
                "class AppController { constructor() { this.init(); } }",
                "export const VERSION = '3.0.1'; console.log(VERSION);"
            ]
        };

        let currentMode = 'html', timeLeft = 30, selectedTime = 30, timer = null, isRunning = false, isPaused = false;
        let charIndex = 0, currentBlockIndex = 0, gameBlocks = [];
        let totalErrorsCount = 0, totalTypedCharsCount = 0;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, dur) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }

        function setMode(m) {
            currentMode = m;
            document.querySelectorAll('.btn-group .btn').forEach(b => {
                if (['html', 'css', 'js'].includes(b.id?.replace('btn-', ''))) b.classList.toggle('active', b.id === 'btn-' + m);
            });
        }

        function setTime(s) {
            selectedTime = s; timeLeft = s;
            document.querySelectorAll('#time-group .btn').forEach(b => b.classList.toggle('active', parseInt(b.innerText) === s));
        }

        function updateLeaderboard() {
            const records = JSON.parse(localStorage.getItem('devTypeRecords') || '[]');
            const list = document.getElementById('records-list');
            list.innerHTML = records.slice(0, 3).map(r => `<div class="record-item"><span>${r.name}</span><span>${r.wpm} WPM</span></div>`).join('');
        }
        updateLeaderboard();

        function startGame() {
            const name = document.getElementById('user-name').value.trim();
            if (!name) return alert("Номи худро ворид кунед!");
            document.getElementById('menu-panel').style.display = 'none';
            document.getElementById('game-panel').style.display = 'block';
            gameBlocks = [...library[currentMode]].sort(() => Math.random() - 0.5).slice(0, 8);
            currentBlockIndex = 0; totalErrorsCount = 0; totalTypedCharsCount = 0;
            isRunning = false; timeLeft = selectedTime;
            document.getElementById('timer').innerText = timeLeft;
            renderBlock();
        }

        function renderBlock() {
            document.getElementById('progress').innerText = currentBlockIndex + 1;
            const area = document.getElementById('typing-area');
            area.innerHTML = "";
            gameBlocks[currentBlockIndex].split("").forEach((c) => {
                const span = document.createElement('span');
                span.className = 'char';
                span.innerText = c;
                span.dataset.orig = c;
                area.appendChild(span);
            });
            document.querySelectorAll('.char')[0].classList.add('current');
            charIndex = 0;
            document.getElementById('hidden-input').value = "";
        }

        document.getElementById('hidden-input').addEventListener('input', (e) => {
            if (isPaused) return;
            if (!isRunning) { isRunning = true; startTimer(); }

            const chars = document.querySelectorAll('.char');
            const inputVal = e.target.value;

            if (inputVal.length > charIndex) {
                playSound(400, 'sine', 0.05);
                totalTypedCharsCount++;
            }
            charIndex = inputVal.length;

            chars.forEach((char, i) => {
                char.classList.remove('current', 'correct', 'incorrect');
                const origChar = char.dataset.orig;
                if (i < charIndex) {
                    if (inputVal[i] === origChar) char.classList.add('correct');
                    else {
                        char.classList.add('incorrect');
                        char.innerText = inputVal[i];
                        if (i === charIndex - 1) { playSound(150, 'square', 0.1); totalErrorsCount++; }
                    }
                } else {
                    char.innerText = origChar;
                }
            });

            if (charIndex < chars.length) chars[charIndex].classList.add('current');
            else {
                currentBlockIndex++;
                if (currentBlockIndex < 8) renderBlock();
                else finishGame();
            }
            updateStats();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && isRunning) {
                isPaused = !isPaused;
                document.getElementById('pause-overlay').style.display = isPaused ? 'flex' : 'none';
            }
        });

        function startTimer() {
            if (timer) clearInterval(timer);
            timer = setInterval(() => {
                if (!isPaused) {
                    if (timeLeft > 0) { timeLeft--; document.getElementById('timer').innerText = timeLeft; }
                    else { finishGame(); }
                    updateStats();
                }
            }, 1000);
        }

        function updateStats() {
            let timeElapsed = (selectedTime - timeLeft) || 1;
            let wpm = Math.round((totalTypedCharsCount / 5) / (timeElapsed / 60)) || 0;
            let acc = Math.round(((totalTypedCharsCount - totalErrorsCount) / totalTypedCharsCount) * 100) || 100;
            document.getElementById('wpm').innerText = wpm;
            document.getElementById('accuracy').innerText = (acc < 0) ? 0 : acc;
        }

        function finishGame() {
            clearInterval(timer);
            document.getElementById('cert-modal').style.display = 'flex';
            document.getElementById('cert-display-name').innerText = document.getElementById('user-name').value;
            document.getElementById('cert-wpm-val').innerText = document.getElementById('wpm').innerText;
            document.getElementById('cert-acc-val').innerText = document.getElementById('accuracy').innerText;
            document.getElementById('cert-words-val').innerText = Math.round(totalTypedCharsCount / 5);
            document.getElementById('cert-errors-val').innerText = totalErrorsCount;

            let records = JSON.parse(localStorage.getItem('devTypeRecords') || '[]');
            records.push({ name: document.getElementById('user-name').value, wpm: parseInt(document.getElementById('wpm').innerText) });
            records.sort((a, b) => b.wpm - a.wpm);
            localStorage.setItem('devTypeRecords', JSON.stringify(records.slice(0, 3)));
            updateLeaderboard();
        }
    </script>
</body>

</html>
