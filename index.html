<!DOCTYPE html>
<html lang="tg">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevType Tajikistan | Error Feedback</title>
    <style>
        :root {
            --main-color: #6366f1;
            --error-color: #ef4444;
            --panel-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1e293b;
            --text-sub: #94a3b8;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
        }

        .bg-animate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(-45deg, #f1f5f9, #e0e7ff, #ede9fe, #f1f5f9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        .bg-animate::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        @keyframes gradientBG {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .main-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.05);
            width: 90%;
            max-width: 650px;
            text-align: center;
            position: relative;
            z-index: 10;
            overflow: hidden;
        }

        #menu-panel::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, transparent, rgba(99, 102, 241, 0.03), transparent);
            z-index: -1;
            animation: shine 6s linear infinite;
        }

        @keyframes shine {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        .code-symbol {
            position: absolute;
            font-size: 8rem;
            font-weight: 900;
            color: var(--main-color);
            opacity: 0.03;
            z-index: -1;
            pointer-events: none;
        }

        .exit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            border: 1.5px solid #e2e8f0;
            padding: 5px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            color: var(--text-main);
            transition: all 0.2s;
        }

        .exit-btn:hover {
            background: #fee2e2;
            border-color: var(--error-color);
        }

        .header-title {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .header-title span {
            color: var(--main-color);
        }

        .label {
            display: block;
            font-size: 0.7rem;
            margin: 15px 0 8px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 800;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
        }

        .btn {
            background: #fff;
            border: 1.5px solid #e2e8f0;
            padding: 8px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            transition: 0.3s;
        }

        .btn:hover {
            border-color: var(--main-color);
        }

        .btn.active {
            background: var(--main-color);
            color: #fff;
            border-color: var(--main-color);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3);
        }

        #typing-area {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.8rem;
            line-height: 1.6;
            text-align: left;
            color: #cbd5e1;
            margin-top: 20px;
            min-height: 120px;
            word-break: break-all;
            position: relative;
        }

        .char {
            position: relative;
        }

        .char.correct {
            color: var(--text-main);
        }

        .char.incorrect {
            color: var(--error-color);
            background: rgba(239, 68, 68, 0.1);
            border-radius: 4px;
        }

        .char.incorrect::after {
            content: attr(data-user-char);
            position: absolute;
            top: -25px;
            left: 0;
            font-size: 0.9rem;
            color: var(--error-color);
            font-weight: bold;
            background: white;
            padding: 0 4px;
            border-radius: 4px;
            border: 1px solid var(--error-color);
            white-space: nowrap;
            z-index: 20;
        }

        .char.current {
            border-bottom: 3px solid var(--main-color);
            color: var(--main-color);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                border-color: transparent;
            }
        }

        #pause-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .pause-text {
            background: var(--main-color);
            color: white;
            padding: 15px 30px;
            border-radius: 20px;
            font-weight: 800;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

            100% {
                transform: scale(1);
            }
        }

        #result-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            z-index: 110;
            justify-content: center;
            align-items: center;
        }

        .modal-card {
            background: #fff;
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            width: 80%;
            max-width: 500px;
            position: relative;
        }

        #hidden-input {
            position: fixed;
            top: -100px;
            left: -100px;
            opacity: 0;
        }

        .start-btn {
            background: var(--main-color);
            color: #fff;
            border: none;
            padding: 15px 50px;
            border-radius: 15px;
            font-weight: 800;
            margin-top: 25px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            transition: 0.3s;
        }

        .start-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-item {
            background: #f8fafc;
            padding: 15px;
            border-radius: 15px;
            border: 1px solid #e2e8f0;
        }

        .stat-num {
            display: block;
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--main-color);
        }
    </style>
</head>

<body onclick="forceFocus()">

    <div class="bg-animate"></div>

    <div id="menu-panel" class="main-panel">
        <div class="code-symbol" style="top: -20px; left: -20px;">{ }</div>
        <div class="code-symbol" style="bottom: -20px; right: -20px; font-size: 6rem;">&lt;/&gt;</div>

        <h1 class="header-title"><span>DevType</span></h1>

        <input type="text" id="user-name"
            style="padding:15px; border-radius:15px; border:2px solid #e2e8f0; width:85%; text-align:center; outline:none; font-size: 1rem;"
            placeholder="Номи шумо...">

        <span class="label">Забони код</span>
        <div class="btn-group">
            <button onclick="setMode('html')" id="m-html" class="btn active">HTML</button>
            <button onclick="setMode('css')" id="m-css" class="btn">CSS</button>
            <button onclick="setMode('js')" id="m-js" class="btn">JS</button>
        </div>

        <span class="label">Вақт</span>
        <div class="btn-group">
            <button onclick="setTime(15)" id="t-15" class="btn">15с</button>
            <button onclick="setTime(30)" id="t-30" class="btn active">30с</button>
            <button onclick="setTime(60)" id="t-60" class="btn">60с</button>
        </div>

        <span class="label">Душворӣ</span>
        <div class="btn-group">
            <button onclick="setLevel('easy')" id="l-easy" class="btn">Осон</button>
            <button onclick="setLevel('mid')" id="l-mid" class="btn active">Миёна</button>
            <button onclick="setLevel('hard')" id="l-hard" class="btn">Душвор</button>
        </div>

        <button class="start-btn" onclick="startGame()">ОҒОЗИ БОЗӢ</button>
    </div>

    <div id="game-panel" class="main-panel" style="display: none;">
        <button class="exit-btn" onclick="location.reload()">БАРОМАД</button>
        <div style="display:flex; justify-content: flex-start; align-items:center; margin-bottom: 10px;">
            <span id="timer-val" style="font-weight:900; font-size:2rem; color:var(--main-color);">30</span>
            <span
                style="margin-left: 15px; font-size:0.7rem; color:var(--text-sub); background: #eee; padding: 5px 10px; border-radius: 8px;">ESC
                - ПАУЗА</span>
        </div>
        <div id="typing-area"></div>
        <input type="text" id="hidden-input" autocomplete="off" spellcheck="false">
    </div>

    <div id="pause-overlay">
        <div class="pause-text">ESC-РО ПАХШ КУНЕД БАРОИ ДАВОМ</div>
    </div>

    <div id="result-overlay">
        <div class="modal-card">
            <h1 id="res-name" style="margin:0; color:var(--text-main);">User</h1>
            <div class="stat-grid">
                <div class="stat-item"><span class="label">WPM</span><span id="res-wpm" class="stat-num">0</span></div>
                <div class="stat-item"><span class="label">Хатоҳо</span><span id="res-errors" class="stat-num">0</span>
                </div>
                <div class="stat-item"><span class="label">Калимаҳо</span><span id="res-words" class="stat-num">0</span>
                </div>
                <div class="stat-item"><span class="label">CPS</span><span id="res-cps" class="stat-num">0</span></div>
            </div>
            <button class="start-btn" onclick="location.reload()">Аз нав</button>
        </div>
    </div>

    <script>
        const library = {
            html: {
                easy: ["<div>", "<span>", "<h1>", "<a>", "<img>"],
                mid: ["<section>", "<footer>", "<button>", "<input>", "<ul><li>"],
                hard: ["<template>", "<svg viewBox='0 0 100 100'>", "<meta charset='UTF-8'>"]
            },
            css: {
                easy: ["color:red;", "margin:0;", "padding:10px;"],
                mid: ["display:flex;", "justify-content:center;", "border-radius:12px;"],
                hard: ["backdrop-filter:blur(10px);", "grid-template-columns:1fr 1fr;"]
            },
            js: {
                easy: ["let x=5;", "const y=10;", "alert('Hi');"],
                mid: ["function sum(a,b)", "arr.push(item);", "if(x === y)"],
                hard: ["async function getData()", "new Promise((res, rej))"]
            }
        };

        let currentMode = 'html', currentLevel = 'mid', gameTime = 30, timeLeft = 30;
        let charIndex = 0, currentBlockStr = "", isRunning = false, isPaused = false, timer = null;
        let totalChars = 0, errors = 0, correctChars = 0;

        function setMode(m) { currentMode = m; updateUI(); }
        function setTime(t) { gameTime = t; timeLeft = t; updateUI(); }
        function setLevel(l) { currentLevel = l; updateUI(); }

        function updateUI() {
            document.querySelectorAll('.btn').forEach(b => {
                b.classList.remove('active');
                if (b.id === 'm-' + currentMode || b.id === 't-' + gameTime || b.id === 'l-' + currentLevel) b.classList.add('active');
            });
            document.getElementById('timer-val').innerText = timeLeft;
        }

        function forceFocus() {
            if (document.getElementById('game-panel').style.display === 'block' && !isPaused) {
                document.getElementById('hidden-input').focus();
            }
        }

        function startGame() {
            if (!document.getElementById('user-name').value) return alert("Номро ворид кунед!");
            document.getElementById('menu-panel').style.display = 'none';
            document.getElementById('game-panel').style.display = 'block';
            generateNewBlock();
            setTimeout(forceFocus, 50);
        }

        function generateNewBlock() {
            let pool = library[currentMode][currentLevel];
            let selected = [];
            for (let i = 0; i < 4; i++) selected.push(pool[Math.floor(Math.random() * pool.length)]);
            currentBlockStr = selected.join(" ");
            const area = document.getElementById('typing-area');
            area.innerHTML = "";
            currentBlockStr.split("").forEach(c => {
                const span = document.createElement('span');
                span.innerText = c;
                span.className = 'char';
                area.appendChild(span);
            });
            charIndex = 0;
            document.querySelectorAll('.char')[0].classList.add('current');
            document.getElementById('hidden-input').value = "";
        }

        window.addEventListener('keydown', (e) => {
            if (e.key === "Escape" && document.getElementById('game-panel').style.display === 'block') {
                togglePause();
            }
        });

        function togglePause() {
            if (!isRunning) return;
            if (!isPaused) {
                isPaused = true;
                clearInterval(timer);
                document.getElementById('pause-overlay').style.display = 'flex';
            } else {
                isPaused = false;
                document.getElementById('pause-overlay').style.display = 'none';
                timer = setInterval(updateTimer, 1000);
                forceFocus();
            }
        }

        function updateTimer() {
            if (timeLeft > 0) {
                timeLeft--;
                document.getElementById('timer-val').innerText = timeLeft;
            } else {
                finishGame();
            }
        }

        document.getElementById('hidden-input').addEventListener('input', (e) => {
            if (isPaused || timeLeft <= 0) return;
            if (!isRunning) { isRunning = true; timer = setInterval(updateTimer, 1000); }

            const chars = document.querySelectorAll('.char');
            const val = e.target.value;

            if (val.length > charIndex) {
                let lastChar = val[val.length - 1];
                if (lastChar === currentBlockStr[charIndex]) {
                    correctChars++;
                } else {
                    errors++;
                    // МАҲЗ ҲАМИН ҶО: ба ҳарфи нодуруст атрибути маълумотро илова мекунем
                    chars[charIndex].setAttribute('data-user-char', lastChar === " " ? "_" : lastChar);
                }
            }

            charIndex = val.length;
            chars.forEach((char, i) => {
                char.classList.remove('current', 'correct', 'incorrect');
                if (i < charIndex) {
                    char.classList.add(val[i] === currentBlockStr[i] ? 'correct' : 'incorrect');
                }
            });
            if (charIndex < chars.length) chars[charIndex].classList.add('current');
            else generateNewBlock();
        });

        function finishGame() {
            clearInterval(timer);
            isRunning = false;
            const timeSpent = gameTime - timeLeft;
            const wordsCount = Math.round(correctChars / 5);
            const wpm = Math.round((wordsCount / timeSpent) * 60) || 0;
            const cps = (correctChars / timeSpent).toFixed(1) || 0;
            document.getElementById('res-name').innerText = document.getElementById('user-name').value;
            document.getElementById('res-wpm').innerText = wpm;
            document.getElementById('res-errors').innerText = errors;
            document.getElementById('res-words').innerText = wordsCount;
            document.getElementById('res-cps').innerText = cps;
            document.getElementById('result-overlay').style.display = 'flex';
        }
    </script>
</body>

</html>
